<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x181824);scene.fog=new THREE.FogExp2(0x292937,.0028);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.5,1600);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9eabc7,0x1a1112,2.15));const sun=new THREE.DirectionalLight(0xd98b7d,2.5);sun.position.set(-120,170,-180);scene.add(sun);const rim=new THREE.DirectionalLight(0x879ab8,1.4);rim.position.set(160,80,110);scene.add(rim);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});const rock=[mat(0x35343b),mat(0x414048),mat(0x292b33),mat(0x4b4649)];const paving=mat(0x49434a),wallmat=mat(0x25232b),edgeMat=mat(0x69616a),metal=mat(0x5a343a),glow= new THREE.MeshBasicMaterial({color:0xff9a4d});
function mesh(g,m,x=0,y=0,z=0){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o}function box(w,h,d,m,x,y,z){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z)}function cyl(rt,rb,h,m,x,y,z,n=7){return mesh(new THREE.CylinderGeometry(rt,rb,h,n),m,x,y,z)}
function rand(a,b){return a+Math.random()*(b-a)}

box(100,3,100,paving,0,0,0);box(102,1.1,102,edgeMat,0,-1.9,0);
for(let side=0;side<4;side++){for(let i=0;i<64;i++){let t=-49+i*98/63;let x=0,z=0;if(side===0){x=t;z=-51}else if(side===1){x=t;z=51}else if(side===2){x=-51;z=t}else{x=51;z=t}let height=rand(34,90),width=rand(2.8,7.4);let o=cyl(width*.52,width,height,rock[Math.floor(rand(0,rock.length))],x+rand(-2,2),-height/2-2,z+rand(-2,2),5);o.rotation.y=rand(0,Math.PI);}}

for(let i=0;i<130;i++){let a=rand(0,Math.PI*2),r=rand(74,300);let x=Math.cos(a)*r,z=Math.sin(a)*r,h=rand(12,100);let o=cyl(rand(3,10),rand(7,17),h,rock[i%4],x,-h/2-rand(15,55),z,5);o.rotation.z=rand(-.16,.16)}

for(let x of [-128,-52])for(let z of [-8.5,8.5]){box(5,12,5,wallmat,x,6,z);cyl(3.8,2.9,5,edgeMat,x,14,z,4);}

for(let x of [-117,-92,-67]){for(let z of [-5,5])box(3,31,3,wallmat,x,-17,z);let arch=mesh(new THREE.TorusGeometry(5,1.6,7,20,Math.PI),wallmat,x,-18,0);arch.rotation.y=Math.PI/2;}
// Torch pedestals and small warm point lights.
for(let x of [-128,-104,-78,-54])for(let z of [-8,8]){cyl(.65,.9,3,edgeMat,x,5,z,6);mesh(new THREE.ConeGeometry(.95,2.2,7),glow,x,7.3,z);let l=new THREE.PointLight(0xff783b,9,20);l.position.set(x,7,z);scene.add(l)}

for(let i=0;i<70;i++){let a=rand(0,Math.PI*2),r=rand(260,600),h=rand(50,210);let o=cyl(0,rand(15,45),h,rock[i%4],Math.cos(a)*r,-35,Math.sin(a)*r,5);o.rotation.z=rand(-.12,.12)}

const mistMat=new THREE.MeshBasicMaterial({color:0x9293a5,transparent:true,opacity:.065,depthWrite:false,side:THREE.DoubleSide});for(let i=0;i<90;i++){let o=mesh(new THREE.CircleGeometry(rand(15,55),24),mistMat,rand(-290,290),rand(-80,-35),rand(-290,290));o.rotation.x=-Math.PI/2;}

// Lord of Blood V01: expanded fortress occupying most of the 100 x 100 plateau.
const masonry=mat(0x45424a),trim=mat(0x68616b),roofMat=mat(0x211d29),floorMat=mat(0x50474b),glass= new THREE.MeshBasicMaterial({color:0xd47748});
const castle=new THREE.Group();scene.add(castle);
function cb(w,h,d,m,x,y,z,parent=castle){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}

for(const x of [-47,47]){for(const z of [-30,30])cb(3.5,11,34,masonry,x,7,z);for(let z=-45;z<=45;z+=6){if(x===-47&&Math.abs(z)<11)continue;cb(4.5,2.5,3.4,trim,x,13.7,z)}}

for(const z of [-13,13]){cc(5.5,6,19,masonry,-44,11,z,8);cc(6,6.2,2,trim,-44,21,z,8);peak(10,10,9,-44,26,z)}
cb(5,5,17,masonry,-47,16,0); // lintel over open entrance

 // Gothic V02: closed pointed gate, aligned with the bridge.
 const gateWood=mat(0x251419),gateIron=mat(0x74636a);
 function pointedShape(w,h,shoulder=.68){
   const a=new THREE.Shape(),r=w/2;
   a.moveTo(-r,0);a.lineTo(r,0);a.lineTo(r,h*shoulder);

 for(const z of [-5.6,-2.8,0,2.8,5.6]){
   cb(.24,11,.17,gateIron,-49.37,7.1,z);

for(const x of [-44,44])for(const z of [-44,44]){cc(5.5,6.3,22,masonry,x,12,z,8);cc(6.4,6.4,2,trim,x,24,z,8);peak(11,11,11,x,30,z)}
// Five occupied floors: castle core enlarged, leaving an accessible ring-shaped courtyard.
// Castle spans x -17..38 and z -34..34, with a wide western forecourt.

const storeys=[];
const H=18, stone=floorMat;
// Stairwell bounds: west x=12, east x=38 (existing outer wall),
// south z=3, north z=34 (existing outer wall).

for(let level=0;level<5;level++){
 const g=new THREE.Group();castle.add(g);storeys.push(g);
 const base=2+level*H;
 // Floor outside stairwell. Ground floor stays fully solid.
 cb(55,1.1,37,stone,10.5,base,-15.5,g); // south of stairwell
 cb(29,1.1,31,stone,-2.5,base,18.5,g); // west of stairwell
 if(level===0)cb(26,1.1,31,stone,25,base,18.5,g);

   cb(26,1.1,5,stone,25,base,5.5,g); // front z=3..8
   cb(26,1.1,3,stone,25,base,32.5,g); // rear z=31..34
   cb(5,1.1,23,stone,35.5,base,19.5,g); // east perimeter
 }
 // Retain castle exterior walls, north and east enclose the stairwell.
 cb(55,H-.5,2.6,masonry,10.5,base+H/2,-34,g);
 cb(55,H-.5,2.6,masonry,10.5,base+H/2,34,g);
 cb(2.6,H-.5,68,masonry,38,base+H/2,0,g);
 if(level===0){
   for(const z of [-22,22])cb(2.6,H-.5,24,masonry,-17,base+H/2,z,g);
   cb(2.6,5,20,masonry,-17,base+H-2.5,0,g);
 }else cb(2.6,H-.5,68,masonry,-17,base+H/2,0,g);
 // New internal west wall touches the north exterior wall (z=34).
 cb(1.6,H-.5,31,masonry,12,base+H/2,18.5,g);
 // New south wall touches west interior and east exterior wall.
 // Wide centered doorway, x=19..29, in front of both stair flights.
 cb(7,H-.5,1.6,masonry,15.5,base+H/2,3,g);
 cb(9,H-.5,1.6,masonry,33.5,base+H/2,3,g);
 cb(10,H-8,1.6,masonry,24,base+8+(H-8)/2,3,g);
 cb(.6,8,1.8,trim,19,base+4,3,g);

 if(level<4){

roof.position.set(10.5,102,0);roofs.add(roof);

 cc(8.5,8.5,.8,floorMat,32,2+level*18,18,10,keep);
 for(let a=0;a<8;a++){const t=a*Math.PI/4;const o=cb(1.3,3,.35,glass,32+8.6*Math.cos(t),10+level*18,18+8.6*Math.sin(t),keep);o.rotation.y=-t;}

let floorView=5;floorButton.onclick=()=>{floorView=(floorView+5)%6;for(let i=0;i<5;i++)storeys[i].visible=i<floorView;roofs.visible=floorView===5;keep.visible=floorView===5;floorButton.textContent=floorView===5?'Etagen: Alle':'Etagen: '+floorView};
document.querySelector('#header small').textContent='V02 · GOTISCHE FENSTER UND TOR';

// Camera orbit, tilt, zoom and two-finger pan.
let target=new THREE.Vector3(0,0,0),yaw=.85,pitch=.92,dist=225;function updateCamera(){let c=Math.cos(pitch);camera.position.set(target.x+dist*c*Math.sin(yaw),target.y+dist*Math.sin(pitch),target.z+dist*c*Math.cos(yaw));camera.lookAt(target)}updateCamera();let touches=new Map(),prevMid=null,prevDistance=0;
function touchMetrics(){let a=[...touches.values()];if(a.length<2)return null;return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}}
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});let m=touchMetrics();if(m){prevMid=m;prevDistance=m.d}});renderer.domElement.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;let p=touches.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){yaw-=dx*.007;pitch=Math.max(.13,Math.min(1.53,pitch+dy*.006))}else{let m=touchMetrics();if(prevMid&&m){let right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));target.addScaledVector(right,-(m.x-prevMid.x)*dist*.0014);target.addScaledVector(forward,(m.y-prevMid.y)*dist*.0014);dist=Math.max(25,Math.min(400,dist*prevDistance/Math.max(1,m.d)));}prevMid=m;prevDistance=m.d}updateCamera()});function end(e){touches.delete(e.pointerId);let m=touchMetrics();prevMid=m;prevDistance=m?m.d:0}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(25,Math.min(400,dist*Math.exp(e.deltaY*.001)));updateCamera()},{passive:false});
document.getElementById('reset').onclick=()=>{target.set(0,0,0);yaw=.85;pitch=.92;dist=225;updateCamera()};document.getElementById('grid').onclick=e=>{lines.visible=!lines.visible;e.target.textContent='Raster: '+(lines.visible?'An':'Aus')};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('loading').remove();function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
}catch(e){document.getElementById('loading').remove();let el=document.getElementById('error');el.style.display='block';el.textContent='3D-Ansicht konnte nicht gestartet werden: '+e.message;console.error(e)}
